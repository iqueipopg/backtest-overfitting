[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bto"
version = "0.1.0"
description = "Deflated Sharpe Ratio and Probability of Backtest Overfitting on a strategy zoo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["bto"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
